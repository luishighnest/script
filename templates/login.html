<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00e59b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { overflow-x: hidden; }
        body {
            background-color: #0b0f19;
            background-image:
                radial-gradient(ellipse 70% 50% at 15% -5%, rgba(0, 225, 140, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse 75% 55% at 85% -8%, rgba(0, 125, 255, 0.32) 0%, transparent 65%),
                radial-gradient(ellipse 90% 60% at 50% 20%, rgba(18, 38, 78, 0.55) 0%, transparent 80%),
                radial-gradient(circle at 50% 100%, rgba(10, 16, 28, 0.9) 0%, transparent 70%);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .auth-card {
            background: rgba(17, 18, 26, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }
        .auth-card h3 {
            font-family: 'Outfit', 'SF Pro Display', -apple-system, sans-serif;
            letter-spacing: 0.02em;
        }
        .btn-dazn {
            background-color: var(--accent);
            color: #04120c;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 229, 155, 0.25);
        }
        .btn-dazn:hover {
            background-color: #2cf0ad;
            color: #04120c;
            box-shadow: 0 6px 20px rgba(0, 229, 155, 0.35);
        }
        .form-control {
            background-color: #0b0f19;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-radius: 10px;
        }
        .form-control:focus {
            background-color: #0b0f19;
            border-color: rgba(0, 229, 155, 0.5);
            box-shadow: 0 0 0 3px rgba(0, 229, 155, 0.12);
            color: #ffffff;
        }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.35); }
        ::selection { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-lock fa-3x text-warning mb-3"></i>
            <h3 class="fw-bold text-white">Accesso Riservato</h3>
            <p class="text-secondary small">Inserisci la password profilo per accedere a <code>/script</code></p>
        </div>
        {% if error %}
        <div class="alert alert-danger py-2 small"><i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label text-secondary small">Password Profilo</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Password..." required autofocus>
            </div>
            <button type="submit" class="btn btn-dazn w-100 py-2">
                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Accedi a /script
            </button>
        </form>
    </div>
</body>
</html>
